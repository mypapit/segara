# Segara CMS — Apache virtual host
# Document root is public/. Data (store/, uploads/, settings/) stays outside the
# document root and is never web-accessible.
#
# Replace example.com and the certificate paths before use.
# Verify: apache2ctl configtest

# --- HTTP: redirect everything to HTTPS --------------------------------------
<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>

# --- HTTPS -------------------------------------------------------------------
<VirtualHost *:443>
    ServerName example.com

    DocumentRoot /var/www/segara/public

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/example.com.crt
    SSLCertificateKeyFile   /etc/ssl/private/example.com.key
    SSLCertificateChainFile /etc/ssl/certs/example.com-chain.crt

    # Upload/body limit: images capped at 5 MiB by the app; allow a little headroom.
    LimitRequestBody 8388608

    <Directory /var/www/segara/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted

        # Clean-URL routing through the front controller, admin, and media handlers.
        <IfModule mod_rewrite.c>
            RewriteEngine On
            # Serve real files and directories as-is (admin.php, media.php, assets).
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            # Everything else through the public front controller.
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>

    # --- Data is never a document ------------------------------------------------
    # store/, uploads/ and settings/ live outside DocumentRoot, so these sections are
    # inert while that is true. They are what stops a DocumentRoot pointed at
    # /var/www/segara instead of /var/www/segara/public from serving the SQLite
    # database. Keep the pattern identical to nginx-php-fpm.conf.
    <FilesMatch "(?i)\.(?:sqlite3?|db3?)(?:-(?:wal|shm|journal))?$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/var/www/segara/(store|uploads|settings)(/|$)">
        Options -Indexes
        Require all denied
    </DirectoryMatch>

    # Optional: an external htpasswd layer as the FIRST admin gate (in front of
    # the application login). Generate the file outside the document root:
    #   htpasswd -c /etc/apache2/segara-htpasswd admin
    #<Location /admin.php>
    #    AuthType Basic
    #    AuthName "Segara Administration"
    #    AuthUserFile /etc/apache2/segara-htpasswd
    #    Require valid-user
    #</Location>

    # Never execute PHP out of any separately-deployed documents/videos folder.
    <DirectoryMatch "^/var/www/segara/(documents|videos)/">
        php_admin_flag engine off
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/segara-error.log
    CustomLog ${APACHE_LOG_DIR}/segara-access.log combined
</VirtualHost>
