# Segara CMS — Nginx + PHP-FPM
# Document root is public/. Data (store/, uploads/, settings/) stays outside the
# document root. Does NOT rely on .htaccess.
#
# Replace example.com, the certificate paths, and the PHP-FPM socket before use.
# Verify: nginx -t
#
# If another server (e.g. Apache) already owns port 80 on the target IP, delete
# the HTTP server block below and serve HTTPS-only on 443.

# --- HTTP: redirect everything to HTTPS --------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/segara/public;
    index index.php;

    client_max_body_size 8m;

    # Never serve dotfiles (git, editor backups, etc.).
    location ~ /\. {
        deny all;
    }

    # --- Data is never a document ------------------------------------------------
    # store/ holds the SQLite database, its -wal/-shm sidecars, session files and
    # backups; uploads/ holds the originals media.php streams; settings/ holds
    # config.php. All three sit OUTSIDE this document root, so these rules should
    # never fire. They exist for the day `root` is pointed at the application
    # directory instead of public_html/. 404, not 403: a denial must not confirm
    # that a file exists. Keep the pattern identical to apache-vhost.conf.
    location ~* \.(?:sqlite3?|db3?)(?:-(?:wal|shm|journal))?$ {
        return 404;
    }

    location ^~ /store/ {
        return 404;
    }

    location ^~ /uploads/ {
        return 404;
    }

    location ^~ /settings/ {
        return 404;
    }

    # Optional: an external htpasswd layer as the FIRST admin gate.
    # Generate the file outside the document root:
    #   htpasswd -c /etc/nginx/segara-htpasswd admin
    #location = /admin.php {
    #    auth_basic "Segara Administration";
    #    auth_basic_user_file /etc/nginx/segara-htpasswd;
    #    include fastcgi_params;
    #    fastcgi_param SCRIPT_FILENAME $document_root/admin.php;
    #    fastcgi_param QUERY_STRING $query_string;
    #    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    #}

    # Clean URLs: real files and dirs are served as-is, everything else goes to
    # the public front controller (which also handles /rss.xml, /sitemap.xml).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP controllers (index.php, admin.php, media.php).
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Never execute PHP out of any separately-deployed documents/videos folder.
    location ~ ^/(documents|videos)/.*\.php$ {
        deny all;
    }
}
